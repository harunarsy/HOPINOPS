name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: git diff --check

  database:
    if: ${{ vars.DB_TEST_ENABLED == '1' }}
    runs-on: ubuntu-latest
    env:
      DB_TEST_PROJECT_REF: ${{ vars.DB_TEST_PROJECT_REF }}
      DB_TEST_DATABASE_URL: ${{ secrets.DB_TEST_DATABASE_URL }}
      DB_TEST_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db:fresh
